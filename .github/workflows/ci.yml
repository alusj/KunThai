name: CI

# Runs on every pull request and every branch push, so a change is checked
# (and Vercel builds its preview) before anything is merged into main.
on:
  pull_request:
  push:
    branches-ignore:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Translations are complete
        run: node scripts/check-locale-bundles.mjs

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build
