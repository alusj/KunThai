<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/brand/kunthai-launch-logo.webp" />
    <link rel="preload" as="image" type="image/webp" href="/brand/kunthai-launch-logo.webp" fetchpriority="high" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f1f5f9" />
    <link rel="canonical" href="https://kunthai.app/" />
    <meta property="og:url" content="https://kunthai.app/" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/kunthai-192.png" />
    <script>
      (() => {
        window.__KUNTHAI_BOOT_STARTED_AT__ = performance.now();
        try {
          const saved = localStorage.getItem("kuntai-appearance-mode");
          const mode = saved === "on" || saved === "off" || saved === "system" ? saved : "system";
          const dark = mode === "on" || (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.dataset.appearanceMode = mode;
          document.documentElement.dataset.appearance = dark ? "dark" : "light";
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", dark ? "#020617" : "#f1f5f9");
        } catch {
          // The React provider applies the default if browser storage is unavailable.
        }
      })();
    </script>
    <title>KunThai</title>
    <style>
      body {
        margin: 0;
        background: #f1f5f9;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .kt-startup-shell {
        min-height: 100vh;
        min-height: 100dvh;
        background: #f1f5f9;
      }

      .kt-startup-header {
        position: sticky;
        top: 0;
        z-index: 1;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        min-height: calc(64px + env(safe-area-inset-top, 0px));
        padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
        border-bottom: 1px solid #e2e8f0;
        background: rgba(255, 255, 255, 0.96);
      }

      .kt-startup-row,
      .kt-startup-actions {
        display: flex;
        gap: 8px;
      }

      .kt-startup-actions {
        justify-content: flex-end;
      }

      .kt-startup-dot,
      .kt-startup-tab,
      .kt-startup-line,
      .kt-startup-avatar,
      .kt-startup-card-media {
        animation: kt-startup-pulse 1.25s ease-in-out infinite;
        background: #e2e8f0;
      }

      .kt-startup-dot {
        width: 40px;
        height: 40px;
        border-radius: 14px;
      }

      .kt-startup-brand {
        display: grid;
        justify-items: center;
        gap: 8px;
      }

      .kt-startup-brand .kt-startup-line:first-child {
        width: 64px;
        height: 8px;
        border-radius: 999px;
        background: #dbeafe;
      }

      .kt-startup-brand .kt-startup-line:last-child {
        width: 84px;
        height: 12px;
        border-radius: 999px;
      }

      .kt-startup-main {
        display: grid;
        gap: 16px;
        padding: 16px;
      }

      .kt-startup-tabs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      .kt-startup-tab {
        height: 48px;
        border-radius: 20px;
        background: #ffffff;
      }

      .kt-startup-card {
        border: 1px solid #e2e8f0;
        border-radius: 24px;
        background: #ffffff;
        padding: 20px;
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.05);
      }

      .kt-startup-card-head {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .kt-startup-avatar {
        width: 48px;
        height: 48px;
        flex: none;
        border-radius: 999px;
      }

      .kt-startup-copy {
        flex: 1;
        display: grid;
        gap: 8px;
      }

      .kt-startup-copy .kt-startup-line:first-child {
        width: 60%;
        height: 16px;
        border-radius: 999px;
      }

      .kt-startup-copy .kt-startup-line:last-child {
        width: 38%;
        height: 12px;
        border-radius: 999px;
        background: #f1f5f9;
      }

      html.dark body,
      html.dark .kt-startup-shell {
        background: #020617;
      }

      html.dark .kt-startup-header,
      html.dark .kt-startup-tab,
      html.dark .kt-startup-card {
        border-color: #1e293b;
        background: #0f172a;
      }

      html.dark .kt-startup-dot,
      html.dark .kt-startup-line,
      html.dark .kt-startup-avatar,
      html.dark .kt-startup-card-media,
      html.dark .kt-startup-copy .kt-startup-line:last-child {
        background: #1e293b;
      }

      .kt-startup-card-media {
        height: 128px;
        margin-top: 20px;
        border-radius: 20px;
        background: #f1f5f9;
      }

      @keyframes kt-startup-pulse {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 1;
        }
      }

      /* First browser paint, before the React bundle is ready. The launch mark
         is deliberately time-bounded; the structural shell underneath remains
         useful even if JavaScript or the network takes longer to become ready. */
      .kt-boot-intro {
        position: fixed;
        inset: 0;
        z-index: 2147483600;
        display: grid;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        place-items: center;
        overflow: hidden;
        background: #002a24;
      }

      .kt-boot-intro img {
        display: block;
        width: clamp(10rem, 48vmin, 16rem);
        height: auto;
        border-radius: 24%;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
      }

      .kt-boot-intro--leaving {
        opacity: 0;
        transform: scale(1.035);
        transition: opacity 280ms ease, transform 280ms ease;
        pointer-events: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .kt-startup-dot,
        .kt-startup-tab,
        .kt-startup-line,
        .kt-startup-avatar,
        .kt-startup-card-media {
          animation: none;
        }

        .kt-boot-intro--leaving {
          transition-duration: 80ms;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="kt-startup-shell" aria-hidden="true">
        <header class="kt-startup-header">
          <div class="kt-startup-row">
            <span class="kt-startup-dot"></span>
            <span class="kt-startup-dot"></span>
          </div>
          <div class="kt-startup-brand">
            <span class="kt-startup-line"></span>
            <span class="kt-startup-line"></span>
          </div>
          <div class="kt-startup-actions">
            <span class="kt-startup-dot"></span>
            <span class="kt-startup-dot"></span>
          </div>
        </header>
        <main class="kt-startup-main">
          <div class="kt-startup-tabs">
            <span class="kt-startup-tab"></span>
            <span class="kt-startup-tab"></span>
            <span class="kt-startup-tab"></span>
          </div>
          <article class="kt-startup-card">
            <div class="kt-startup-card-head">
              <span class="kt-startup-avatar"></span>
              <div class="kt-startup-copy">
                <span class="kt-startup-line"></span>
                <span class="kt-startup-line"></span>
              </div>
            </div>
            <div class="kt-startup-card-media"></div>
          </article>
          <article class="kt-startup-card">
            <div class="kt-startup-card-head">
              <span class="kt-startup-avatar"></span>
              <div class="kt-startup-copy">
                <span class="kt-startup-line"></span>
                <span class="kt-startup-line"></span>
              </div>
            </div>
            <div class="kt-startup-card-media"></div>
          </article>
        </main>
      </div>
      <div id="kt-boot-intro" class="kt-boot-intro" role="status" aria-label="Loading KunThai">
        <img
          src="/brand/kunthai-launch-logo.webp"
          alt="KunThai"
          width="512"
          height="512"
          decoding="sync"
          fetchpriority="high"
        />
      </div>
    </div>
    <script>
      (() => {
        const intro = document.getElementById("kt-boot-intro");
        if (!intro) return;
        const startedAt = Number(window.__KUNTHAI_BOOT_STARTED_AT__ || performance.now());
        const elapsed = Math.max(0, performance.now() - startedAt);
        const reduced = window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;
        const leaveAt = reduced ? 220 : 560;
        const removeAt = reduced ? 380 : 980;
        window.setTimeout(() => intro.classList.add("kt-boot-intro--leaving"), Math.max(0, leaveAt - elapsed));
        window.setTimeout(() => intro.remove(), Math.max(0, removeAt - elapsed));
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
